<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>To-Do List</h1>

    <div class="input-section">
      <!-- Input Task -->
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Add a new task..." 
      />

      <!-- Input Date (WAJIB sesuai soal) -->
      <input 
        type="date" 
        id="dateInput" 
      />

      <!-- Tombol Add -->
      <button id="addBtn">Add</button>
    </div>

    <!-- Tempat daftar task muncul -->
    <ul id="taskList"></ul>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
